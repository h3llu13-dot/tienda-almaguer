let pr={q:'',cat:'',tab:'list'},prSel=new Set();
const margin=p=>p.price>0?(p.price-p.cost)/p.price*100:0;
function roundP(x,m){if(m==='99')return Math.max(.99,Math.floor(x)+.99);if(m==='50')return Math.max(.5,Math.round(x*2)/2);if(m==='25')return Math.max(.25,Math.round(x*4)/4);if(m==='1')return Math.max(1,Math.round(x));return r2(x)}
const ROUNDS=`<option value="none">Sin redondeo</option><option value="99">Terminar en .99</option><option value="25">Al .25 más cercano</option><option value="50">Al .50 más cercano</option><option value="1">Número entero</option>`;
const TARGETS=[['price','Precio de venta'],['both','Costo y precio'],['cost','Solo costo']];
/* Aplica un % a un producto. target: price | both | cost */
function applyPct(p,v,target,rd,who){const f=1+v/100;const np=target!=='cost'?roundP(p.price*f,rd):p.price;const nc=target!=='price'?r2(p.cost*f):p.cost;
 if(np===p.price&&nc===p.cost)return false;S.priceHistory.unshift({id:uid(),ts:Date.now(),pid:p.id,name:p.name,oldPrice:p.price,newPrice:np,oldCost:p.cost,newCost:nc,user:who});p.price=np;p.cost=nc;p.updated=Date.now();return true}
function setPriceDirect(p,np,who){np=r2(np);if(np===p.price)return false;S.priceHistory.unshift({id:uid(),ts:Date.now(),pid:p.id,name:p.name,oldPrice:p.price,newPrice:np,oldCost:p.cost,newCost:p.cost,user:who});p.price=np;p.updated=Date.now();return true}
function vPrices(){return tabs('pr',pr.tab,[['list','Lista de precios'],['history','Historial de cambios']])+(pr.tab==='list'?`<div class="card pad" style="margin-bottom:16px"><div class="sec-h"><h3>${ic('trend')} Aumento de precios por porcentaje</h3><span class="small muted">Para todos los productos, una categoría o los que seleccione en la lista</span></div>
 <div class="bulk"><div><label class="f">¿A qué productos?</label><select class="in" id="bScope">${scopeOptions()}</select></div><div><label class="f">Tipo de ajuste</label><select class="in" id="bMode" onchange="$('#bTarget').disabled=this.value!=='pct'"><option value="pct">Subir o bajar %</option><option value="margin">Fijar margen % sobre precio</option><option value="markup">Fijar ganancia % sobre costo</option></select></div><div><label class="f">Porcentaje</label><input class="in" id="bVal" type="number" step="any" placeholder="ej. 10"></div><div><label class="f">Aplicar a</label><select class="in" id="bTarget">${TARGETS.map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></div><div><label class="f">Redondeo</label><select class="in" id="bRound">${ROUNDS}</select></div><button class="btn primary" onclick="bulkPrice()">Aplicar</button></div>
 <div class="pctq"><span class="small muted" style="align-self:center">Rápido:</span>${[-10,-5,5,10,15,20,25].map(v=>`<button class="btn sm" onclick="$('#bMode').value='pct';$('#bTarget').disabled=false;$('#bVal').value=${v}">${v>0?'+':''}${v}%</button>`).join('')}</div></div>
 <div class="toolbar"><div class="grow searchbox">${ic('search')}<input class="in" placeholder="Buscar productos…" value="${esc(pr.q)}" oninput="pr.q=this.value;drawPrices()"></div><select class="in w-auto" onchange="pr.cat=this.value;drawPrices()">${catOptions(pr.cat,'Todas las categorías')}</select><span class="small muted" id="selInfo"></span></div><div class="card tbl-wrap" id="prT"></div>`:`<div class="card tbl-wrap" id="phT"></div>`)}
function scopeOptions(){const n=S.products.filter(p=>p.active!==false).length;return `<option value="all">Todos los productos (${n})</option><option value="sel">Seleccionados (${prSel.size})</option>${cats().map(c=>`<option value="cat:${esc(c)}">Categoría: ${esc(c)} (${S.products.filter(p=>p.active!==false&&p.category===c).length})</option>`).join('')}`}
function afterPrices(){pr.tab==='list'?drawPrices():drawPH()}
function prList(){const q=pr.q.toLowerCase();return S.products.filter(p=>(!pr.cat||p.category===pr.cat)&&(!q||[p.name,p.sku,p.barcode].join(' ').toLowerCase().includes(q))).sort((a,b)=>a.name.localeCompare(b.name,'es'))}
function drawPrices(){const el=$('#prT');if(!el)return;const l=prList();[...prSel].forEach(id=>{if(!prod(id))prSel.delete(id)});
 const allSel=l.length&&l.every(p=>prSel.has(p.id));
 el.innerHTML=l.length?`<table><thead><tr><th><input type="checkbox" title="Seleccionar todos" ${allSel?'checked':''} onchange="selAll(this.checked)"></th><th>Producto</th><th>Categoría</th><th class="num">Costo</th><th class="num">Precio de venta</th><th class="num">Margen</th><th class="num">Ganancia / ud</th><th class="num">Ajuste %</th></tr></thead><tbody>${l.map(p=>`<tr class="${p.active===false?'dim':''}"><td class="selc"><input type="checkbox" ${prSel.has(p.id)?'checked':''} onchange="selOne('${p.id}',this.checked)"></td><td><span class="pcell">${thumb(p)}<span><b>${esc(p.name)}</b><div class="small muted mono">${esc(p.sku||'')}</div></span></span></td><td>${esc(p.category||'—')}</td><td class="num"><input class="in xs" type="number" step="0.01" min="0" value="${(+p.cost).toFixed(2)}" onchange="setPrice('${p.id}','cost',this.value)"></td><td class="num"><input class="in xs" type="number" step="0.01" min="0" value="${(+p.price).toFixed(2)}" onchange="setPrice('${p.id}','price',this.value)"></td><td class="num" id="m_${p.id}">${mCell(p)}</td><td class="num" id="u_${p.id}">${fmt(p.price-p.cost)}</td><td class="num"><button class="btn sm" onclick="pctModal('${p.id}')">${ic('trend')}± %</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty">No hay productos.</div>`;updSel()}
function selOne(id,on){on?prSel.add(id):prSel.delete(id);updSel()}
function selAll(on){prList().forEach(p=>on?prSel.add(p.id):prSel.delete(p.id));drawPrices()}
function updSel(){const s=$('#bScope');if(s){const v=s.value;s.innerHTML=scopeOptions();s.value=v;if(prSel.size&&v==='all')s.value='sel'}const i=$('#selInfo');if(i)i.innerHTML=prSel.size?`${prSel.size} seleccionado${prSel.size>1?'s':''} · <a href="#" onclick="event.preventDefault();prSel.clear();drawPrices()">quitar selección</a>`:''}
const mCell=p=>{const m=margin(p);return `<span class="badge ${m<10?'red':m<25?'':'green'}">${m.toFixed(1)}%</span>`};
function setPrice(id,k,v){const p=prod(id);const val=r2(Math.max(0,num(v)));if(p[k]===val)return;S.priceHistory.unshift({id:uid(),ts:Date.now(),pid:p.id,name:p.name,oldPrice:p.price,newPrice:k==='price'?val:p.price,oldCost:p.cost,newCost:k==='cost'?val:p.cost,user:SES.name});p[k]=val;p.updated=Date.now();log(`${k==='price'?'Precio':'Costo'} de ${p.name} → ${fmt(val)}`);save();const mc=$('#m_'+id),uc=$('#u_'+id);if(mc)mc.innerHTML=mCell(p);if(uc)uc.innerHTML=fmt(p.price-p.cost);toast('Guardado','ok')}
function bulkPrice(){const scope=$('#bScope').value,mode=$('#bMode').value,v=num($('#bVal').value),rd=$('#bRound').value,target=mode==='pct'?$('#bTarget').value:'price';
 if($('#bVal').value==='')return toast('Ingrese un porcentaje','err');if(mode==='pct'&&v<=-100)return toast('El porcentaje debe ser mayor que -100','err');if(mode==='margin'&&(v>=100||v<0))return toast('El margen debe estar entre 0 y 99%','err');
 const l=scope==='sel'?S.products.filter(p=>prSel.has(p.id)):S.products.filter(p=>p.active!==false&&(scope==='all'||p.category===scope.slice(4)));
 if(!l.length)return toast(scope==='sel'?'Seleccione productos en la lista':'No hay productos en ese grupo','err');
 const calc=p=>mode==='pct'?{price:target!=='cost'?roundP(p.price*(1+v/100),rd):p.price,cost:target!=='price'?r2(p.cost*(1+v/100)):p.cost}:{price:roundP(mode==='margin'?p.cost/(1-v/100):p.cost*(1+v/100),rd),cost:p.cost};
 const ex=l.slice(0,4).map(p=>{const c=calc(p);return `${esc(p.name)}: ${target==='cost'?`costo ${fmt(p.cost)} → <b>${fmt(c.cost)}</b>`:`${fmt(p.price)} → <b>${fmt(c.price)}</b>`}`}).join('<br>');
 const what=mode==='pct'?`${v>0?'subir':'bajar'} un <b>${Math.abs(v)}%</b> ${target==='price'?'el precio de venta':target==='both'?'el costo y el precio':'el costo'}`:mode==='margin'?`fijar un margen de <b>${v}%</b>`:`fijar una ganancia de <b>${v}%</b> sobre el costo`;
 confirmBox('Aplicar ajuste de precios',`¿Desea ${what} de <b>${l.length}</b> producto${l.length>1?'s':''}?<br><br><span class="small">${ex}${l.length>4?'<br>…':''}</span>`,()=>{let n=0;const who=SES.name+' (ajuste masivo)';l.forEach(p=>{if(mode==='pct'){if(applyPct(p,v,target,rd,who))n++}else if(setPriceDirect(p,calc(p).price,who))n++});log(`Ajuste masivo de precios: ${mode==='pct'?pct(v):v+'%'} en ${n} productos`);save();drawPrices();toast(`${n} producto${n===1?'':'s'} actualizado${n===1?'':'s'}`,'ok')},'Aplicar')}
let pcT='price';
function pctModal(id){const p=prod(id);pcT='price';
 modal(`${mHead('Ajustar precio por porcentaje')}<div class="mb"><div class="info pcell" style="margin-bottom:16px">${thumb(p)}<span><b>${esc(p.name)}</b><br>Costo ${fmt(p.cost)} · Precio ${fmt(p.price)} · Margen ${margin(p).toFixed(1)}% · Existencia ${qf(p.stock)}</span></div>
 <label class="f">Porcentaje (use negativo para bajar)</label><input class="in big" id="pcVal" type="number" step="any" placeholder="ej. 10" oninput="pcPreview('${id}')" onkeydown="if(event.key==='Enter')applyPctOne('${id}')">
 <div class="pctq">${[-10,-5,5,10,15,20,25,30].map(v=>`<button class="btn sm" onclick="$('#pcVal').value=${v};pcPreview('${id}')">${v>0?'+':''}${v}%</button>`).join('')}</div>
 <label class="f" style="margin-top:16px">Aplicar a</label><div class="seg" id="pcSeg">${TARGETS.map(([k,l])=>`<button data-k="${k}" class="${k===pcT?'act':''}" onclick="pcT='${k}';document.querySelectorAll('#pcSeg button').forEach(b=>b.classList.toggle('act',b.dataset.k===pcT));pcPreview('${id}')">${l}</button>`).join('')}</div>
 <label class="f">Redondeo del precio</label><select class="in" id="pcRound" onchange="pcPreview('${id}')">${ROUNDS}</select>
 <div class="preview" id="pcPrev" style="margin-top:16px"></div></div>
 <div class="mf"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="applyPctOne('${id}')">Aplicar</button></div>`);pcPreview(id);setTimeout(()=>$('#pcVal')?.focus(),40)}
function pcPreview(id){const p=prod(id),el=$('#pcPrev');if(!el)return;const v=num($('#pcVal').value),rd=$('#pcRound').value,f=1+v/100;
 const np=pcT!=='cost'?roundP(p.price*f,rd):p.price,nc=pcT!=='price'?r2(p.cost*f):p.cost,nm=np>0?(np-nc)/np*100:0;
 el.innerHTML=`<div class="r"><span>Precio de venta</span><span>${fmt(p.price)} → <b>${fmt(np)}</b> <span class="small ${np>=p.price?'green':'red'}">${np!==p.price?(np>p.price?'+':'')+fmt(np-p.price):''}</span></span></div><div class="r"><span>Costo</span><span>${fmt(p.cost)} → <b>${fmt(nc)}</b></span></div><div class="r"><span>Margen</span><span>${margin(p).toFixed(1)}% → <b>${nm.toFixed(1)}%</b></span></div>`}
function applyPctOne(id){const p=prod(id),raw=$('#pcVal').value,v=num(raw);if(raw===''||!v)return toast('Ingrese un porcentaje','err');if(v<=-100)return toast('El porcentaje debe ser mayor que -100','err');
 if(applyPct(p,v,pcT,$('#pcRound').value,SES.name)){log(`Ajuste ${pct(v)} a ${p.name} (${TARGETS.find(t=>t[0]===pcT)[1].toLowerCase()})`);save();toast(`${p.name}: nuevo precio ${fmt(p.price)}`,'ok')}else toast('No hubo cambio');closeModal();if(VIEW==='prices')drawPrices();else if(VIEW==='inventory')drawInv()}
function drawPH(){const el=$('#phT');const l=S.priceHistory.slice(0,500);const ch=(a,b)=>a>0&&a!==b?`<span class="small ${b>a?'red':'green'}">${pct((b-a)/a*100)}</span>`:'';
 el.innerHTML=l.length?`<table><thead><tr><th>Fecha</th><th>Producto</th><th class="num">Costo</th><th class="num">Precio</th><th class="num">Cambio</th><th>Usuario</th></tr></thead><tbody>${l.map(h=>`<tr><td class="small">${dt(h.ts)}</td><td>${esc(h.name)}</td><td class="num"><span>${h.oldCost!==h.newCost?`<span class="muted">${fmt(h.oldCost)}</span> → ${fmt(h.newCost)}`:`<span class="muted">${fmt(h.newCost)}</span>`}</span></td><td class="num"><span>${h.oldPrice!==h.newPrice?`<span class="muted">${fmt(h.oldPrice)}</span> → <b>${fmt(h.newPrice)}</b>`:`<span class="muted">${fmt(h.newPrice)}</span>`}</span></td><td class="num">${ch(h.oldPrice,h.newPrice)||ch(h.oldCost,h.newCost)}</td><td class="small">${esc(h.user)}</td></tr>`).join('')}</tbody></table>`:`<div class="empty">Aún no hay cambios de precio.</div>`}

let sl={range:'today',q:''};
function rangeBounds(r){const n=new Date(),d=i=>new Date(n.getFullYear(),n.getMonth(),n.getDate()-i).getTime();switch(r){case'today':return[d(0),Infinity];case'yesterday':return[d(1),d(0)];case'7d':return[d(6),Infinity];case'30d':return[d(29),Infinity];case'month':return[new Date(n.getFullYear(),n.getMonth(),1).getTime(),Infinity];default:return[0,Infinity]}}
function salesList(){const[a,b]=rangeBounds(sl.range);const q=sl.q.trim().replace('#','').toLowerCase();return S.sales.filter(s=>s.ts>=a&&s.ts<b&&(can('sales')||s.userId===SES.id)&&(!q||String(s.no).includes(q)||s.user.toLowerCase().includes(q)||s.items.some(i=>i.name.toLowerCase().includes(q))))}

 $('#slK').innerHTML=`<div class="card kpi accent"><div class="l">Ventas netas</div><div class="v">${fmt(sum(ok,s=>s.total))}</div><div class="s">${ok.length} completadas · ${l.length-ok.length} anuladas</div></div><div class="card kpi"><div class="l">Efectivo</div><div class="v">${fmt(byM('Efectivo'))}</div></div><div class="card kpi"><div class="l">Tarjeta / Transferencia</div><div class="v">${fmt(byM('Tarjeta')+byM('Transferencia'))}</div></div>${can('sales')?`<div class="card kpi"><div class="l">Ganancia bruta</div><div class="v">${fmt(sum(ok,saleProfit))}</div></div>`:''}`;
 $('#slT').innerHTML=l.length?`<table><thead><tr><th>Recibo</th><th>Fecha</th><th>Cajero</th><th class="num">Artículos</th><th>Pago</th><th class="num">Total</th><th>Estado</th><th></th></tr></thead><tbody>${l.slice(0,500).map(s=>`<tr class="${s.status==='void'?'dim':''}"><td><b>#${s.no}</b></td><td class="small">${dt(s.ts)}</td><td>${esc(s.user)}</td><td class="num">${qf(sum(s.items,i=>i.qty))}</td><td>${esc(s.method)}</td><td class="num"><b>${fmt(s.total)}</b></td><td>${s.status==='void'?'<span class="badge red">Anulada</span>':'<span class="badge green">Pagada</span>'}</td><td class="acts"><button class="btn sm" onclick="receiptModal('${s.id}')">Recibo</button>${SES.isAdmin&&s.status==='completed'?` <button class="btn sm ghost danger" onclick="voidSale('${s.id}')">Anular</button>`:''}</td></tr>`).join('')}</tbody></table>`:`<div class="empty">${ic('receipt','xl')}<p>No hay ventas en este período.</p></div>`}
function voidSale(id){const s=S.sales.find(x=>x.id===id);confirmBox('Anular venta',`¿Anular el recibo <b>#${s.no}</b> por <b>${fmt(s.total)}</b>? Los artículos regresarán al inventario.`,()=>{s.items.forEach(i=>{const p=prod(i.pid);if(p)addMove(p,'void',i.qty,'Anulación de venta #'+s.no)});s.status='void';s.voidBy=SES.name;s.voidTs=Date.now();s.updated=Date.now();log(`Anuló la venta #${s.no}`);save();drawSales();toast('Venta anulada')},'Anular venta')}
function exportSales(){const rows=[['recibo','fecha','cajero','producto','sku','cantidad','precio','total_linea','descuento_venta','total_venta','pago','estado']];salesList().forEach(s=>s.items.forEach(i=>rows.push([s.no,new Date(s.ts).toLocaleString('es'),s.user,i.name,i.sku,i.qty,i.price,r2(i.qty*i.price),s.discount,s.total,s.method,s.status==='void'?'anulada':'pagada'])));download('tienda-almaguer-ventas.csv',toCSV(rows),'text/csv')}

/* ---------- Dependientes ---------- */
function pinTaken(pin,except){return (except!=='admin'&&hash('admin:'+pin)===S.admin.pinHash)||S.users.some(u=>u.id!==except&&hash(u.id+':'+pin)===u.pinHash)}
function vUsers(){return `<div class="toolbar"><div class="grow muted small">Los dependientes entran con su propio PIN. Usted decide a qué tiene acceso cada uno.</div><button class="btn primary" onclick="userModal()">${ic('plus')}Agregar dependiente</button></div><div class="ugrid">
 <div class="card ucard" style="background:linear-gradient(135deg,#2A2D33,#17181C);color:#fff;border:0"><div class="uhead"><div class="avatar lg" style="background:var(--red)">${esc(initials(S.admin.name))}</div><div><b>${esc(S.admin.name)}</b><div class="small" style="color:var(--g400)">Administrador · acceso total</div></div></div><div class="small" style="color:var(--g400)">PIN ${S.admin.defaultPin?`<b style="color:#fff">${DEFAULT_PIN} (predeterminado — cámbielo)</b>`:'configurado'} · Código de acceso ${S.admin.code?'configurado':'sin configurar'}</div><button class="btn sm" style="width:max-content" onclick="go('settings')">Seguridad</button></div>
 ${S.users.map(u=>`<div class="card ucard"><div class="uhead"><div class="avatar lg">${esc(initials(u.name))}</div><div style="flex:1;min-width:0"><b>${esc(u.name)}</b><div class="small muted">${u.lastLogin?'Último acceso '+dt(u.lastLogin):'Nunca ha entrado'}</div></div>${u.active!==false?'<span class="badge green">Activo</span>':'<span class="badge red">Desactivado</span>'}</div><div class="tags">${PERMS.filter(([k])=>u.perms[k]).map(([,l])=>`<span class="badge">${l}</span>`).join('')||'<span class="muted small">Sin acceso asignado</span>'}</div><div style="display:flex;gap:8px"><button class="btn sm" onclick="userModal('${u.id}')">${ic('edit')}Editar / PIN</button><button class="btn sm ghost danger" onclick="delUser('${u.id}')" title="Eliminar">${ic('trash')}</button></div></div>`).join('')}</div>${S.users.length?'':`<div class="empty">${ic('users','xl')}<h3>Aún no hay dependientes</h3><p>Agregue a su personal para que cada persona venda con su propio PIN.</p></div>`}`}
function userModal(id){const u=id?S.users.find(x=>x.id===id):{name:'',perms:{pos:true},active:true};
 modal(`${mHead(id?'Editar dependiente':'Nuevo dependiente')}<div class="mb"><div class="grid2"><div class="span2"><label class="f">Nombre completo *</label><input class="in" id="uName" value="${esc(u.name)}"></div>
 <div><label class="f">${id?'Nuevo PIN':'PIN *'} (3–6 dígitos)</label><input class="in" id="uPin" type="password" inputmode="numeric" maxlength="6" placeholder="${id?'Vacío = no cambiar':''}" autocomplete="new-password"></div><div><label class="f">Confirmar PIN</label><input class="in" id="uPin2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></div>
 <div class="span2"><label class="f">Acceso</label><div style="display:grid;gap:8px">${PERMS.map(([k,l])=>`<label class="check"><input type="checkbox" id="perm_${k}" ${u.perms[k]?'checked':''}>${l}</label>`).join('')}</div></div>
 <label class="check span2"><input type="checkbox" id="uAct" ${u.active!==false?'checked':''}>Cuenta activa (puede entrar)</label></div></div>
 <div class="mf"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveUser('${id||''}')">Guardar</button></div>`);setTimeout(()=>$('#uName')?.focus(),40)}
function saveUser(id){const name=$('#uName').value.trim(),pin=$('#uPin').value.trim(),pin2=$('#uPin2').value.trim();if(!name)return toast('El nombre es obligatorio','err');
 if(!id||pin){if(!/^\d{3,6}$/.test(pin))return toast('El PIN debe tener de 3 a 6 dígitos','err');if(pin!==pin2)return toast('Los PIN no coinciden','err');if(pinTaken(pin,id||'__new'))return toast('Ese PIN ya está en uso. Elija otro.','err')}
 const perms={};PERMS.forEach(([k])=>perms[k]=$('#perm_'+k).checked);
 if(id){const u=S.users.find(x=>x.id===id);Object.assign(u,{name,perms,active:$('#uAct').checked,updated:Date.now()});if(pin){u.pinHash=hash(u.id+':'+pin);log('Cambió el PIN de '+name)}log('Actualizó al dependiente '+name)}
 else{const nid=uid();S.users.push({id:nid,name,perms,active:$('#uAct').checked,pinHash:hash(nid+':'+pin),created:Date.now(),updated:Date.now()});log('Creó al dependiente '+name)}
 save();closeModal();toast('Dependiente guardado','ok');render()}
function delUser(id){const u=S.users.find(x=>x.id===id);confirmBox('Eliminar dependiente',`¿Eliminar a <b>${esc(u.name)}</b>? Sus ventas anteriores se conservan.`,()=>{S.users=S.users.filter(x=>x.id!==id);S.deleted[id]=Date.now();log('Eliminó al dependiente '+u.name);save();render()},'Eliminar')}

/* ---------- Ajustes, seguridad y copias ---------- */
function applyAdminSec(pin,pin2,code,pass,pass2){code=(code||'').trim();
 if(pin||pin2){if(!/^\d{3,6}$/.test(pin))return'El PIN debe tener de 3 a 6 dígitos';if(pin!==pin2)return'Los PIN no coinciden';if(pin===DEFAULT_PIN)return'Elija un PIN distinto de '+DEFAULT_PIN;if(pinTaken(pin,'admin'))return'Ese PIN lo usa un dependiente'}
 if(code&&code.length<3)return'El código de acceso debe tener al menos 3 caracteres';
 if(pass||pass2){if(pass.length<4)return'La contraseña debe tener al menos 4 caracteres';if(pass!==pass2)return'Las contraseñas no coinciden';if(!code&&!S.admin.code)return'Configure también un código de acceso'}
 if(code&&!pass&&!S.admin.passHash)return'Configure también una contraseña';
 if(pin||code||pass)touchA();
 if(pin){S.admin.pinHash=hash('admin:'+pin);S.admin.defaultPin=false;log('Cambió el PIN de administrador')}
 if(code&&code!==S.admin.code){S.admin.code=code;log('Cambió el código de acceso del administrador')}
 if(pass){S.admin.passHash=hash('adminpw:'+pass);log('Cambió la contraseña del administrador')}save();return null}
function secFields(){return `<div><label class="f">Nuevo PIN (3–6 dígitos)</label><input class="in" id="xPin" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></div><div><label class="f">Confirmar PIN</label><input class="in" id="xPin2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></div>
 <div class="span2"><label class="f">Código de acceso</label><input class="in" id="xCode" value="${esc(S.admin.code)}" placeholder="ej. almaguer" autocomplete="off"></div>
 <div><label class="f">${S.admin.passHash?'Nueva contraseña':'Contraseña'}</label><input class="in" id="xPass" type="password" autocomplete="new-password"></div><div><label class="f">Confirmar contraseña</label><input class="in" id="xPass2" type="password" autocomplete="new-password"></div>`}
function readSec(){return applyAdminSec($('#xPin').value.trim(),$('#xPin2').value.trim(),$('#xCode').value,$('#xPass').value,$('#xPass2').value)}
function firstRunModal(){modal(`${mHead('Bienvenido a '+esc(S.settings.storeName))}<div class="mb"><div class="banner" style="margin-bottom:16px"><span>Entró con el PIN de administrador predeterminado <b>${DEFAULT_PIN}</b>. Configure ahora su propio PIN, código de acceso y contraseña.</span></div><div class="grid2">${secFields()}</div></div><div class="mf"><button class="btn" onclick="closeModal()">Después</button><button class="btn primary" onclick="const e=readSec();if(e)toast(e,'err');else{closeModal();toast('Seguridad del administrador actualizada','ok');render()}">Guardar</button></div>`);setTimeout(()=>$('#xPin')?.focus(),40)}
function vSettings(){const st=S.settings,sv=st.server;return `${defaultPinBanner()}<div class="sgrid">
 <div class="card pad"><div class="sec-h"><h3>Tienda</h3></div><div class="grid2"><div class="span2"><label class="f">Nombre de la tienda</label><input class="in" id="sName" value="${esc(st.storeName)}"></div><div class="span2"><label class="f">Dirección</label><input class="in" id="sAddr" value="${esc(st.address)}"></div><div><label class="f">Teléfono</label><input class="in" id="sPhone" value="${esc(st.phone)}"></div><div><label class="f">Símbolo de moneda</label><input class="in" id="sCur" value="${esc(st.currency)}" maxlength="4"></div><div><label class="f">Existencia baja predeterminada</label><input class="in" id="sLow" type="number" min="0" value="${st.lowStockDefault}"></div><div><label class="f">Bloqueo automático (min, 0 = nunca)</label><input class="in" id="sLock" type="number" min="0" value="${st.autoLockMin}"></div><div class="span2"><label class="f">Pie del recibo</label><input class="in" id="sFoot" value="${esc(st.receiptFooter)}"></div><label class="check span2"><input type="checkbox" id="sNeg" ${st.allowNegative?'checked':''}>Permitir vender artículos sin existencia</label></div><div class="right"><button class="btn primary" onclick="saveStore()">Guardar ajustes de la tienda</button></div></div>
 <div class="card pad"><div class="sec-h"><h3>${ic('palette')} Tema predeterminado de la tienda</h3></div><p class="small muted" style="margin-top:0">Se usa para quien no haya elegido su propio tema. Cada usuario puede elegir el suyo con el botón ${ic('palette')} en el menú lateral.</p>${themeCards(st.theme||'radiante','setStoreTheme')}</div>
 <div class="card pad"><div class="sec-h"><h3>Seguridad del administrador</h3>${S.admin.defaultPin?'<span class="badge red">PIN predeterminado</span>':'<span class="badge green">Protegido</span>'}</div><div class="grid2"><div class="span2"><label class="f">Nombre del administrador</label><input class="in" id="xName" value="${esc(S.admin.name)}"></div>${secFields()}</div><div class="info" style="margin-top:14px">Deje los campos vacíos para mantener los valores actuales. El administrador puede entrar con su PIN, o con “Acceso de administrador” en la pantalla de bloqueo usando el código y la contraseña.</div><div class="right"><button class="btn primary" onclick="saveSecurity()">Guardar seguridad</button></div></div>
 ${sharedCard()}
 <div class="card pad"><div class="sec-h"><h3>Copias de seguridad</h3></div><p class="muted small" style="margin-top:0">Todos los datos se guardan en este equipo y funcionan sin internet. Descargue una copia con frecuencia y guárdela en una memoria USB o en la nube.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn dark" onclick="exportBackup()">${ic('download')}Descargar copia</button><button class="btn" onclick="$('#bkIn').click()">${ic('upload')}Restaurar desde archivo</button><input type="file" id="bkIn" accept=".json,application/json" hidden onchange="restoreBackup(this)"></div>
 <div class="sec-h" style="margin-top:24px"><h3>Servidor de respaldo <span class="badge">Opcional</span></h3></div><div class="grid2"><div class="span2"><label class="f">URL del servidor</label><input class="in" id="svUrl" value="${esc(sv.url)}" placeholder="https://su-servidor.com/api/respaldo"></div><div class="span2"><label class="f">Clave API</label><input class="in" id="svKey" type="password" value="${esc(sv.apiKey)}" placeholder="Opcional" autocomplete="off"></div><label class="check span2"><input type="checkbox" id="svAuto" ${sv.auto?'checked':''}>Respaldar automáticamente después de cada venta cuando haya internet</label></div>
 <div class="info" style="margin-top:12px">La aplicación envía un <b>POST</b> con JSON <span class="mono">{ app, store, exportedAt, data }</span> y el encabezado <span class="mono">Authorization: Bearer &lt;clave&gt;</span>.<br>Último respaldo: <b>${sv.lastBackup?dt(sv.lastBackup):'nunca'}</b>${sv.lastStatus?' · '+esc(sv.lastStatus):''}</div>
 <div class="right"><button class="btn" onclick="saveServer()">Guardar</button><button class="btn primary" onclick="saveServer(true);serverBackup()">${ic('cloud')}Respaldar ahora</button></div></div>
 <div class="card pad"><div class="sec-h"><h3>Registro de actividad</h3><button class="btn sm" onclick="download('tienda-almaguer-actividad.csv',toCSV([['fecha','usuario','accion'],...S.audit.map(a=>[new Date(a.ts).toLocaleString('es'),a.user,a.action])]),'text/csv')">${ic('download')}Exportar</button></div><div style="max-height:340px;overflow:auto">${S.audit.slice(0,80).map(a=>`<div class="list-row"><span class="small">${esc(a.action)}<div class="muted">${esc(a.user)}</div></span><span class="small muted">${dt(a.ts)}</span></div>`).join('')||'<p class="muted">Aún no hay actividad.</p>'}</div></div>
 <div class="card pad danger-zone"><div class="sec-h"><h3 class="red">Zona de peligro</h3></div><p class="muted small" style="margin-top:0">Borra todos los productos, ventas, dependientes y ajustes. El PIN de administrador vuelve a ser ${DEFAULT_PIN}. Descargue una copia antes.</p><button class="btn danger" onclick="eraseAll()">${ic('trash')}Borrar todos los datos</button></div></div>`}
/* ---------- Archivo de datos compartido (programa .exe ⇄ navegador) ---------- */
const DESKTOP_FILE='Documentos\\Tienda Almaguer\\tienda-almaguer-data.json';
function sharedCard(){let body;
 if(BACKEND==='desktop')body=`<div class="info">Este programa guarda todo en:<br><b class="mono" style="word-break:break-all">${esc(DATA_PATH)}</b><br>Para usar los mismos datos en un navegador, abra <b>TiendaAlmaguer.html</b> en Chrome o Edge → Ajustes → <b>Vincular archivo existente</b> y elija este archivo. También puede guardarlo en una carpeta compartida de la red para que varias computadoras usen los mismos datos.</div><div class="right"><button class="btn" onclick="taDesktop.showFile()">Mostrar archivo</button><button class="btn" onclick="desktopChoose('open')">Abrir otro archivo de datos…</button><button class="btn dark" onclick="desktopChoose('new')">Mover datos a otra ubicación…</button></div>`;
 else if(BACKEND==='file')body=`<div class="info">${NEED_FILE?'⚠ Sin conexión al archivo. ':'✓ '}Este navegador está vinculado a <b>${esc(FH?FH.name:'')}</b>. Cada cambio se guarda en ese archivo y los cambios hechos en el programa de escritorio aparecen aquí en pocos segundos.${FILE_ERR?`<br><span class="red">${esc(FILE_ERR)}</span>`:''}</div><div class="right">${NEED_FILE?`<button class="btn primary" onclick="reconnectFile()">Reconectar</button>`:''}<button class="btn" onclick="linkFile(false)">Cambiar archivo…</button><button class="btn danger" onclick="confirmBox('Dejar de compartir','Este navegador conservará una copia de los datos actuales y dejará de sincronizarse con el archivo compartido. El archivo no se modifica.',unlinkFile,'Dejar de compartir')">Dejar de compartir</button></div>`;
 else body=`<div class="info">Ahora este navegador guarda su propia copia privada de los datos. Para compartir <b>todos los datos</b> con el programa de Windows (.exe), vincule el mismo archivo de datos. El programa lo crea en <b class="mono">${DESKTOP_FILE}</b>.${window.showOpenFilePicker?'':'<br><span class="red">Este navegador no puede vincular archivos. Use Google Chrome o Microsoft Edge.</span>'}<br>Los datos que ya tenga este navegador se combinan con los del archivo.</div><div class="right"><button class="btn" onclick="linkFile(true)">Crear archivo nuevo…</button><button class="btn primary" onclick="linkFile(false)">Vincular archivo existente…</button></div>`;
 return `<div class="card pad"><div class="sec-h"><h3>Datos compartidos · Programa ⇄ Navegador</h3>${shared()?'<span class="badge green">Compartido</span>':'<span class="badge">Solo este navegador</span>'}</div>${body}</div>`}
const fileErr=e=>e.name==='NotFoundError'?'El archivo se movió o se borró. Elíjalo de nuevo.':e.message;
async function loadFromFile(){const r=await B.read();const remote=parseData(r.text);if(remote)S=mergeStates(S,remote);lastMod=r.mtime;NEED_FILE=false;FILE_ERR='';await persist()}
async function reconnectFile(){try{if(!FH)return linkFile(false);const p=await FH.requestPermission({mode:'readwrite'});if(p!=='granted')throw new Error('No se permitió el acceso');await loadFromFile();toast('Conectado a los datos compartidos','ok');render()}catch(e){FILE_ERR=fileErr(e);render()}}
async function linkFile(create){if(!window.showOpenFilePicker)return toast('Este navegador no puede vincular archivos. Use Chrome o Edge.','err');
 try{const opts={types:[{description:'Datos de Tienda Almaguer',accept:{'application/json':['.json']}}],startIn:'documents'};let h;
  if(create)h=await showSaveFilePicker({...opts,suggestedName:'tienda-almaguer-data.json'});else[h]=await showOpenFilePicker(opts);
  if(await h.requestPermission({mode:'readwrite'})!=='granted')throw new Error('No se permitió el acceso');
  const f=await h.getFile();const remote=parseData(await f.text());
  FH=h;BACKEND='file';NEED_FILE=false;FILE_ERR='';await idbSet('fileHandle',h);
  if(remote)S=mergeStates(S,remote,true);lastMod=f.lastModified;await persist(true);
  log('Vinculó el archivo de datos compartido '+h.name);toast('Datos compartidos vinculados','ok');if(SES&&!SES.isAdmin&&!S.users.some(u=>u.id===SES.id))return lockApp();render()}
 catch(e){if(e.name!=='AbortError')toast('No se pudo vincular el archivo: '+e.message,'err')}}
async function unlinkFile(){FH=null;BACKEND='idb';NEED_FILE=false;FILE_ERR='';try{await idbSet('fileHandle',null)}catch(e){}await persist();toast('Este navegador ahora usa su propia copia');render()}
async function desktopChoose(mode){try{const r=await taDesktop.chooseFile(mode);if(!r)return;DATA_PATH=r.path;const remote=r.text?parseData(r.text):null;if(remote)S=mergeStates(S,remote,true);lastMod=r.mtime;await persist(true);log('Archivo de datos: '+r.path);toast('Archivo de datos actualizado','ok');render()}catch(e){toast('No se pudo usar ese archivo: '+e.message,'err')}}
function saveStore(){const st=S.settings;st.storeName=$('#sName').value.trim()||'Tienda Almaguer';st.address=$('#sAddr').value.trim();st.phone=$('#sPhone').value.trim();st.currency=$('#sCur').value.trim()||'$';st.lowStockDefault=Math.max(0,num($('#sLow').value));st.autoLockMin=Math.max(0,num($('#sLock').value));st.receiptFooter=$('#sFoot').value;st.allowNegative=$('#sNeg').checked;touchS();log('Actualizó los ajustes de la tienda');save();toast('Ajustes guardados','ok');render()}
function saveSecurity(){const nm=$('#xName').value.trim();const e=readSec();if(e)return toast(e,'err');if(nm&&nm!==S.admin.name){S.admin.name=nm;SES.name=nm;touchA();save()}toast('Seguridad guardada','ok');render()}
function backupPayload(){return{app:'tienda-almaguer',version:1,store:S.settings.storeName,exportedAt:new Date().toISOString(),data:S}}
function exportBackup(){const d=new Date().toISOString().slice(0,10);download(`tienda-almaguer-copia-${d}.json`,JSON.stringify(backupPayload()),'application/json');log('Descargó una copia de seguridad')}
function restoreBackup(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);const d=j.data||j;if(!Array.isArray(d.products)||!d.admin)throw new Error('No es una copia de Tienda Almaguer');confirmBox('Restaurar copia',`¿Reemplazar todos los datos actuales por la copia del <b>${esc(j.exportedAt?dt(j.exportedAt):f.name)}</b> (${d.products.length} productos, ${(d.sales||[]).length} ventas)? Se cerrará la sesión.`,async()=>{S=migrate(d);S.epoch={id:uid(),ts:Date.now()};log('Restauró una copia de seguridad');await persist(true);SES=null;render();toast('Copia restaurada','ok')},'Restaurar')}catch(e){toast('No se pudo restaurar: '+e.message,'err')}inp.value=''};r.readAsText(f)}
function saveServer(silent){const sv=S.settings.server;sv.url=$('#svUrl').value.trim();sv.apiKey=$('#svKey').value.trim();sv.auto=$('#svAuto').checked;touchS();save();if(silent!==true)toast('Ajustes del servidor guardados','ok')}
async function serverBackup(quiet){const sv=S.settings.server;if(!sv.url){if(!quiet)toast('Primero ingrese la URL del servidor','err');return}if(!navigator.onLine){if(!quiet)toast('Sin conexión a internet — los datos siguen seguros en este equipo','err');return}
 try{const res=await fetch(sv.url,{method:'POST',headers:{'Content-Type':'application/json',...(sv.apiKey?{Authorization:'Bearer '+sv.apiKey}:{})},body:JSON.stringify(backupPayload())});if(!res.ok)throw new Error('HTTP '+res.status);sv.lastBackup=Date.now();sv.lastStatus='Correcto';save();if(!quiet){toast('Respaldo enviado al servidor','ok');if(VIEW==='settings')render()}}
 catch(e){sv.lastStatus='Falló: '+e.message;save();if(!quiet){toast('Falló el respaldo: '+e.message,'err');if(VIEW==='settings')render()}}}
let _ab;function autoBackupSoon(){if(!S.settings.server.auto||!S.settings.server.url)return;clearTimeout(_ab);_ab=setTimeout(()=>serverBackup(true),4000)}
function eraseAll(){modal(`${mHead('Borrar todos los datos')}<div class="mb"><p style="margin-top:0">Esto elimina para siempre todo lo guardado. Escriba <b>BORRAR</b> para confirmar.</p><input class="in" id="erTxt" autocomplete="off"></div><div class="mf"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="if($('#erTxt').value.trim().toUpperCase()==='BORRAR'){S=defaultState();persist(true);SES=null;closeModal();render();toast('Se borraron todos los datos')}else toast('Escriba BORRAR para confirmar','err')">Borrar todo</button></div>`)}

/* ---------- Vistas y arranque ---------- */
const VIEWS={dashboard:[vDashboard],pos:[vPos,afterPos],inventory:[vInventory,afterInv],prices:[vPrices,afterPrices],sales:[vSales,drawSales],users:[vUsers],settings:[vSettings]};
document.addEventListener('keydown',e=>{lastAct=Date.now();if(e.key==='Escape'&&$('#modal').innerHTML){closeModal();return}
 if(!SES&&lockMode==='pin'&&!NEED_FILE&&!$('#modal').innerHTML){if(/^\d$/.test(e.key))pinKey(e.key);else if(e.key==='Backspace')pinKey('B');else if(e.key==='Enter')submitPin()}});
['mousemove','mousedown','touchstart','scroll'].forEach(ev=>document.addEventListener(ev,()=>lastAct=Date.now(),{passive:true}));
setInterval(()=>{const m=S&&num(S.settings.autoLockMin);if(SES&&m>0&&Date.now()-lastAct>m*60000)lockApp(true)},15000);
addEventListener('online',()=>{const n=$('#net');if(n)n.innerHTML=netPill();autoBackupSoon()});
addEventListener('offline',()=>{const n=$('#net');if(n)n.innerHTML=netPill()});
addEventListener('beforeunload',()=>{if(USE_LS)try{localStorage.setItem('ta_state',JSON.stringify(S))}catch(e){}});
/* En pantallas pequeñas las tablas se vuelven tarjetas: cada celda recibe el nombre de su columna */
let _lt=0;function labelTables(){_lt=0;document.querySelectorAll('#view table').forEach(t=>{const hs=[...t.querySelectorAll('thead th')].map(th=>th.textContent.trim());t.querySelectorAll('tbody tr').forEach(tr=>[...tr.children].forEach((td,i)=>{if(hs[i]&&!td.hasAttribute('data-l'))td.setAttribute('data-l',hs[i])}))})}
new MutationObserver(()=>{if(!_lt)_lt=requestAnimationFrame(labelTables)}).observe(document.getElementById('app'),{childList:true,subtree:true});
setInterval(syncCheck,3000);addEventListener('focus',syncCheck);document.addEventListener('visibilitychange',syncCheck);
window.__flush=async()=>{clearTimeout(_st);await persist()};
/* App instalable (Chromebook, Android, PC): solo cuando se sirve desde un sitio web */
if(/^https?:$/.test(location.protocol)){const l=document.createElement('link');l.rel='manifest';l.href='manifest.webmanifest';document.head.appendChild(l);const a=document.createElement('link');a.rel='apple-touch-icon';a.href='icon-192.png';document.head.appendChild(a);
 if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
(async()=>{$('#favicon').href='data:image/svg+xml,'+encodeURIComponent(logoIcon(64));
 if(window.taDesktop){
  BACKEND='desktop';try{const r=await B.read();S=parseData(r.text)||defaultState();lastMod=r.mtime;if(!r.text)await persist(true)}
  catch(e){S=defaultState();FILE_ERR=e.message;toast('No se pudo leer el archivo de datos: '+e.message,'err')}
 }else{
  try{if(!window.indexedDB)throw 0;const d=await idbGet('state');S=d?migrate(d):defaultState()}
  catch(e){USE_LS=true;try{const ls=localStorage.getItem('ta_state');S=ls?migrate(JSON.parse(ls)):defaultState()}catch(_){S=defaultState()}}
  try{FH=USE_LS?null:await idbGet('fileHandle')}catch(e){FH=null}
  if(FH){BACKEND='file';let p='prompt';try{p=await FH.queryPermission({mode:'readwrite'})}catch(e){}
   if(p==='granted'){try{await loadFromFile()}catch(e){NEED_FILE=true;FILE_ERR=fileErr(e)}}else NEED_FILE=true}
  else await persist();
 }
 render();
 const sv=S.settings.server;if(sv.auto&&sv.url&&navigator.onLine&&(!sv.lastBackup||Date.now()-sv.lastBackup>864e5))serverBackup(true)})();
</script>
</body>
</html>
